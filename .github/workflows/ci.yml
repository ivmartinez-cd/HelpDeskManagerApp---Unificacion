name: CI

# Toda la verificación del repo corre acá, en cada push a main y en cada PR, sin
# tocar la máquina de desarrollo. Desde el 2026-09-02 ningún hook de git corre
# checks pesados en local: medido con la máquina ociosa sobre el HDD USB,
# lint-imports 42 s + mypy 108 s + pytest unit 101 s + sizes/guards 29 s ≈ 5 min
# por push, y con 3-4 sesiones de Claude Code en paralelo eso saturaba el disco
# y freezaba las demás terminales (incidentes 2026-09-01 y 2026-09-02). El
# pre-commit local solo corre ruff sobre lo staged; el pre-push solo lista los
# commits. Quien pushea sigue esta corrida con `make ci` (gh run watch).
#
# Jobs:
#   backend  - lint-imports, ruff, mypy, pytest unit, pytest integration (service
#              container de Postgres propio del runner; el schema sale de
#              Base.metadata.create_all, no de Alembic, ver
#              tests/integration/infrastructure/conftest.py) y los gates
#              §4/§6/§8/§11 (scripts/check_sizes.py y check_guards.py --committed).
#   frontend - eslint + tsc --noEmit.
#   e2e      - suite completa de Playwright. Es hermética: tests/global-setup.ts
#              levanta un backend mock en 127.0.0.1:18099 y cada spec mockea sus
#              datos con page.route(); no necesita el backend real ni la red
#              corporativa (Mercurio/Siges/Gestión, ver
#              project_deploy_render_vercel_neon_blocked_red_interna en la memoria).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Mismas credenciales que docker-compose.test.yml (db-test), así el
    # conftest de tests/integration (que ya sabe leer DB_TEST_HOST/PORT) no
    # necesita ningún caso especial para CI.
    services:
      db-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpdesk_test
          POSTGRES_PASSWORD: helpdesk_test
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    # Settings (settings_groups.py) es fail-fast: exige estos tres campos sin
    # default aunque nada en tests/unit haga una conexión real — son dummies,
    # no secretos (el .env real con credenciales de verdad no se commitea).
    env:
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      DB_TEST_HOST: localhost
      DB_TEST_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run lint-imports
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest tests/unit -q
      - run: uv run pytest tests/integration -q
      - name: Gates §4 tamaños y §6/§8/§11 guards (sobre HEAD)
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/check_sizes.py --committed
          python3 scripts/check_guards.py --committed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # La imagen de producción compila al arrancar (`npm run build && npm run start`):
      # sin este paso un error de build recién aparecía en el arranque del contenedor.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts levanta `next dev --turbopack` (webServer) y el mock
      # backend (globalSetup); en CI reuseExistingServer=false y retries=2.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
