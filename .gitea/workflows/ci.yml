# Gitea Actions busca primero en .gitea/workflows/, y solo cae a
# .github/workflows/ si esta carpeta no existe (compatibilidad para repos
# migrados de GitHub) -- por eso este remoto quedaba encolando
# "CI / backend, frontend, e2e (push) Waiting to run" en cada push, sin
# ningún runner registrado en gitea.canaldirecto.com.ar para tomarlos
# (pedido de Iván 15/9: sacarlo). Esta versión, al existir, bloquea esa
# caída y no dispara solo con push, así que no vuelve a encolar nada.
#
# 2026-09-24: GitHub quedó abandonado, así que este remoto ya no es "solo el
# respaldo" -- es el único. Mientras no se registre un runner acá, NO hay
# verificación automática en ningún lado: `make check` se corre a mano antes
# de dar por terminado un modulo (ver CLAUDE.md). Si algun dia hay runner,
# .github/workflows/ci.yml es el punto de partida.
name: CI (sin runner: la verificacion se corre a mano)
on:
  workflow_dispatch: {}
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Sin runner registrado: la verificacion se corre a mano con make check."
