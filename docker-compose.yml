name: helpdesk-manager

services:
  db:
    image: postgres:17-alpine
    container_name: helpdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    ports:
      - "${DB_PORT:-5439}:5432"
    volumes:
      - helpdesk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: helpdesk-manager-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de la red de Docker el host es el nombre del servicio ("db"), no
      # "localhost", y el puerto es el interno del contenedor (5432), no el
      # publicado al host (DB_PORT/5439).
      DATABASE_URL: postgresql://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-CHANGE_ME}@db:5432/${POSTGRES_DB:-helpdesk}
    ports:
      - "8012:8012"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy

  # Mail catcher de desarrollo: el backend manda por SMTP a mailpit:1025 y los
  # mails quedan en http://localhost:8025 — nunca salen de la máquina. Es la
  # red de seguridad de verdad (además de DISABLE_BACKGROUND_JOBS) contra mails
  # reales a Canal Directo desde dev. Requiere en .env: SMTP_HOST=mailpit,
  # SMTP_PORT=1025, SMTP_STARTTLS=false, SMTP_USER/SMTP_PASS vacíos.
  mailpit:
    image: axllent/mailpit:latest
    container_name: helpdesk-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # UI web + API
      - "1025:1025"   # SMTP (también accesible desde el host)
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  frontend:
    build: ./frontend
    container_name: helpdesk-manager-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # El rewrite de next.config.ts y el fetch server-side de app/(app)/layout.tsx
      # corren dentro de este contenedor: "127.0.0.1" no resuelve al backend acá.
      BACKEND_URL: http://backend:8012
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

volumes:
  helpdesk_db_data:
  backend_venv:
  frontend_node_modules:
  frontend_next_cache:
