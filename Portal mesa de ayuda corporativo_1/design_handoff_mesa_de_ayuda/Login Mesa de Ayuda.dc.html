<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0}
  a{color:#F7941D}
  a:hover{color:#d97e0f}
  ::placeholder{color:#a8a8a8}
  *{box-sizing:border-box}
</style>
</helmet>
<div style="display:flex;min-height:100vh;height:100vh;overflow:hidden;font-family:'Source Sans Pro',sans-serif;color:#232323;align-items:stretch">

  <div style="width:42%;flex:none;background:#232323;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
    <div style="position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(247,148,29,.18),transparent 70%);top:-120px;right:-140px"></div>
    <div style="position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(88,89,91,.25),transparent 70%);bottom:-100px;left:-120px"></div>
    <img src="assets/icon-mark-blanco.png" alt="" style="position:absolute;width:340px;height:auto;bottom:-60px;right:-60px;opacity:.08;object-fit:contain">
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:0 60px;max-width:420px;text-align:center">
      <img src="assets/logo-blanco.png" alt="Canal Directo" style="height:36px;width:169px;display:block;object-fit:contain">
      <div style="width:48px;height:2px;background:#F7941D"></div>
      <span style="font:800 25px 'Montserrat',sans-serif;color:#fff;line-height:1.3">Plataforma Unificada<br>de Operaciones</span>
      <span style="font:14.5px 'Source Sans Pro',sans-serif;color:rgba(255,255,255,.65);line-height:1.5">Insumos, liquidaciones, vacaciones, análisis de logs de impresoras y monitoreo, todo en un solo lugar.</span>
    </div>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;background:#FAFAF8">
    <div style="width:360px;display:flex;flex-direction:column;gap:26px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font:800 25px 'Montserrat',sans-serif;color:#232323">Iniciar sesión</span>
        <span style="font:14px 'Source Sans Pro',sans-serif;color:#8a8a8a">Ingresá con tus credenciales corporativas</span>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font:600 13px 'Source Sans Pro',sans-serif;color:#4b4b4b">Usuario</span>
          <input placeholder="nombre.apellido" style="padding:11px 14px;border-radius:8px;border:1px solid rgba(0,0,0,.15);font:14px 'Source Sans Pro',sans-serif;background:#fff;color:#232323">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font:600 13px 'Source Sans Pro',sans-serif;color:#4b4b4b">Contraseña</span>
            <a href="#" style="font:600 13px 'Source Sans Pro',sans-serif;text-decoration:none">¿Olvidaste tu contraseña?</a>
          </div>
          <input type="password" placeholder="••••••••" style="padding:11px 14px;border-radius:8px;border:1px solid rgba(0,0,0,.15);font:14px 'Source Sans Pro',sans-serif;background:#fff;color:#232323">
        </div>
        <label style="display:flex;align-items:center;gap:8px;font:13px 'Source Sans Pro',sans-serif;color:#6b6b6b">
          <input type="checkbox" style="accent-color:#F7941D">
          Recordarme
        </label>
        <a href="#" style="font:700 14px 'Source Sans Pro',sans-serif;text-decoration:none;background:#F7941D;color:#fff;padding:12px 18px;border-radius:8px;text-align:center;margin-top:6px">Ingresar</a>
      </div>

      <span style="font:12px 'Source Sans Pro',sans-serif;color:#b5b5b5;text-align:center">Portal interno · Canal Directo</span>
    </div>
  </div>

</div>

</x-dc>
</body>
</html>
