[project]
name = "helpdesk-manager-backend"
version = "0.1.0"
description = "HelpDesk Manager — backend monolito modular"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "import-linter==2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# Alembic genera este boilerplate (op/sa) aunque una migración concreta no
# los use todavía; no vale la pena mantenerlo a mano archivo por archivo.
"src/shared/infrastructure/database/migrations/versions/*.py" = ["F401", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "src.modules.*.domain.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# El engine async de test es session-scoped (una sola pool de conexiones para
# toda la suite); necesita un event loop igual de longevo o asyncpg falla con
# "another operation is in progress" al reusar el engine desde otro loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true
