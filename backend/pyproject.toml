[project]
name = "helpdesk-manager-backend"
version = "0.1.0"
description = "HelpDesk Manager — backend monolito modular"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "playwright>=1.62.0",
    "zeep==4.3.3",
    # Windows no trae base de zonas horarias del sistema (zoneinfo la necesita para
    # America/Argentina/Buenos_Aires); en Linux es redundante pero inocuo.
    "tzdata==2026.3",
    "pyodbc==5.2.0",
    # Para parsear el HTML-con-extensión-.xls que exporta el sistema fuente de los
    # prestadores (mismo formato real que parseaba el legacy con pandas.read_html) —
    # ver domain/services/importacion/ e infrastructure/importers/.
    "pandas==3.0.5",
    "lxml==6.1.1",
    # xlrd lee .xls binario real (openpyxl ya cubre .xlsx) — para el importador de
    # Excel maestro de PST, ver infrastructure/importers/pandas_prestador_maestro_file_parser.py.
    "xlrd==2.0.1",
    # fpdf2 genera el PDF del reporte de vacaciones (paridad del PDFKit legacy).
    "fpdf2==2.8.8",
    # SDK de Anthropic para el diagnóstico IA del módulo analisis-log-hp.
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "import-linter==2.13",
    "types-openpyxl==3.1.5.20260807",
    "pandas-stubs==3.0.5.260730",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# Alembic genera este boilerplate (op/sa) aunque una migración concreta no
# los use todavía; no vale la pena mantenerlo a mano archivo por archivo.
"src/shared/infrastructure/database/migrations/versions/*.py" = ["F401", "I001"]
# El system prompt del gateway de IA es contenido de texto, no código:
# las líneas largas son deliberadas para mantener el prompt legible como prosa.
"src/modules/analisis_log_hp/infrastructure/anthropic/anthropic_ai_gateway.py" = ["E501"]
# SQL real de Siges copiado tal cual del proyecto original (comentarios de
# negocio alineados en columnas) — reformatearlo perdería la alineación y
# se apartaría del texto ya validado en producción sin necesidad.
"src/modules/contadores/infrastructure/siges/grilla_estimacion_query.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "src.modules.*.domain.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# zeep no publica stubs ni py.typed — el adapter lo aísla detrás del puerto WsAycGateway.
module = "zeep.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# lxml publica stubs parciales en lxml-stubs (no instalados) — el uso está aislado
# en infrastructure/hp_portal, detrás del puerto HpPortalGateway.
module = "lxml.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# anthropic no publica py.typed — el uso está aislado en infrastructure/anthropic,
# detrás del puerto AiGateway.
module = "anthropic.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# pyodbc no publica py.typed y types-pyodbc no existe en PyPI — el adapter lo
# aísla detrás del puerto SlaQueryGateway.
module = "pyodbc.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# El engine async de test es session-scoped (una sola pool de conexiones para
# toda la suite); necesita un event loop igual de longevo o asyncpg falla con
# "another operation is in progress" al reusar el engine desde otro loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true
