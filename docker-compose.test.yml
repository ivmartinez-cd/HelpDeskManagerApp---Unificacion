name: helpdesk-manager-test

services:
  db-test:
    image: postgres:17-alpine
    container_name: helpdesk-db-test
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: helpdesk_test
      POSTGRES_PASSWORD: helpdesk_test
      POSTGRES_DB: helpdesk_test
    ports:
      - "${DB_TEST_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk_test"]
      interval: 3s
      timeout: 3s
      retries: 10
